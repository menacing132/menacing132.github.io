<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malaky MC</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Background -->
    <div class="bg-overlay"></div>
    <video autoplay muted loop id="bgVideo">
        <source src="background.mp4" type="video/mp4">
    </video>

    <!-- Navbar -->
    <nav>
        <h2 class="logo">MALAKY <span>MC</span></h2>

        <ul class="nav-links">
            <li><a href="index.html" class="active">Home</a></li>
            <li><a href="#">Store</a></li>
            <li><a href="#">Games</a></li>
            <li><a href="#">Support</a></li>
        </ul>

        <a href="https://discord.gg/8FJEanz9" class="discord-btn">Join Discord</a>
    </nav>

    <!-- Content -->
    <section class="content">
        <h1>Welcome to <span>Malaky MC</span></h1>
        <p class="arabic">أفضل سيرفر ماينكرافت عربي</p>

        <div class="ip-box">
            <p>IP: Coming Soon...</p>
            <button onclick="copyIP()">Copy IP</button>
        </div>

        <p class="players">Players Online: <span id="playerCount">0</span></p>
    </section>

<script>
    function copyIP() {
        navigator.clipboard.writeText("Coming Soon");
        alert("IP Copied!");
    }
</script>

</body>
</html>
