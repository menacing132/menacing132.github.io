<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malaky MC</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ===== Video Background ===== -->
    <div class="video-background">
        <video autoplay loop muted playsinline>
            <source src="bg.mp4" type="video/mp4">
        </video>
    </div>

    <!-- ===== Navbar ===== -->
    <nav>
        <h2 class="logo">MALAKY <span>MC</span></h2>
        <ul>
            <li><a href="index.html" class="active">Home</a></li>
            <li><a href="store.html">Store</a></li>
            <li><a href="games.html">Games</a></li>
            <li><a href="support.html">Support</a></li>
        </ul>
    </nav>

    <!-- ===== Content ===== -->
    <div class="content">
        <h1>Welcome to <span>Malaky MC</span></h1>
        <p>أفضل سيرفر ماينكرافت عربي</p>

        <div class="ip-box">
            <p id="server-ip">IP: Coming Soon...</p>
            <button onclick="copyIP()">Copy IP</button>
        </div>

        <div class="players-box">
            Players Online: <span id="playerCount">0</span>
        </div>
    </div>

    <script>
        function copyIP() {
            navigator.clipboard.writeText("Coming Soon");
            alert("IP Copied!");
        }
    </script>

</body>
